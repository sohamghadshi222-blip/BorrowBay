<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BorrowBay | Rent Anything</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* ==============================
           BODY
        ============================== */

        body {

            min-height: 100vh;

            background:
                    linear-gradient(
                            90deg,
                            rgba(11, 18, 32, 0.96) 0%,
                            rgba(11, 18, 32, 0.88) 38%,
                            rgba(11, 18, 32, 0.65) 70%,
                            rgba(11, 18, 32, 0.45) 100%
                    ),
                    url("images/borrowbay-banner.jpg")
                    center / cover no-repeat;

            background-attachment: fixed;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #f8fafc;

        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {

            width: 90%;

            max-width: 1150px;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            padding: 60px 0;

        }


        /* ==============================
           CONTENT
        ============================== */

        .content {

            max-width: 650px;

        }


        /* ==============================
           LOGO
        ============================== */

        .logo {

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.5px;

            margin-bottom: 65px;

        }


        .logo span {

            color: #14b8a6;

        }


        /* ==============================
           HEADING
        ============================== */

        h1 {

            font-size: 60px;

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 25px;

        }


        h1 span {

            color: #14b8a6;

        }


        /* ==============================
           DESCRIPTION
        ============================== */

        .description {

            max-width: 570px;

            color: #cbd5e1;

            font-size: 17px;

            line-height: 1.7;

            margin-bottom: 34px;

        }


        /* ==============================
           BUTTONS
        ============================== */

        .buttons {

            display: flex;

            gap: 14px;

            align-items: center;

            flex-wrap: wrap;

        }


        button {

            min-height: 48px;

            padding: 0 23px;

            border-radius: 9px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;

        }


        /* PRIMARY */

        .primary {

            background: #14b8a6;

            color: white;

            border: 1px solid #14b8a6;

            box-shadow:
                    0 8px 25px rgba(20, 184, 166, 0.25);

        }


        .primary:hover {

            background: #2dd4bf;

            border-color: #2dd4bf;

            transform: translateY(-2px);

            box-shadow:
                    0 10px 30px rgba(20, 184, 166, 0.35);

        }


        /* SECONDARY */

        .secondary {

            background: rgba(15, 23, 42, 0.55);

            border: 1px solid rgba(148, 163, 184, 0.4);

            color: #f1f5f9;

            backdrop-filter: blur(8px);

        }


        .secondary:hover {

            background: rgba(34, 45, 61, 0.85);

            border-color: #64748b;

            transform: translateY(-2px);

        }


        /* ==============================
           SMALL DECORATIVE LINE
        ============================== */

        .content::before {

            content: "";

            display: block;

            width: 55px;

            height: 4px;

            background: #14b8a6;

            border-radius: 5px;

            margin-bottom: 18px;

        }


        /* ==============================
           TABLET
        ============================== */

        @media (max-width: 850px) {

            body {

                background:
                        linear-gradient(
                                90deg,
                                rgba(11, 18, 32, 0.94),
                                rgba(11, 18, 32, 0.72)
                        ),
                        url("images/borrowbay-banner.jpg")
                        center / cover no-repeat;

            }


            .container {

                width: 88%;

            }


            h1 {

                font-size: 50px;

            }


            .logo {

                margin-bottom: 50px;

            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            body {

                background:
                        linear-gradient(
                                rgba(11, 18, 32, 0.90),
                                rgba(11, 18, 32, 0.90)
                        ),
                        url("images/borrowbay-banner.jpg")
                        center / cover no-repeat;

            }


            .container {

                width: 90%;

                min-height: 100vh;

                padding: 40px 0;

                align-items: center;

            }


            .content {

                width: 100%;

            }


            .logo {

                font-size: 27px;

                margin-bottom: 45px;

            }


            h1 {

                font-size: 40px;

                line-height: 1.08;

                letter-spacing: -1px;

                margin-bottom: 22px;

            }


            .description {

                font-size: 15px;

                line-height: 1.65;

                margin-bottom: 28px;

            }


            .buttons {

                width: 100%;

                flex-direction: column;

                align-items: stretch;

            }


            button {

                width: 100%;

            }

        }


        /* ==============================
           SMALL PHONES
        ============================== */

        @media (max-width: 380px) {

            h1 {

                font-size: 34px;

            }


            .description {

                font-size: 14px;

            }


            .logo {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="content">


        <!-- LOGO -->

        <div class="logo">

            Borrow<span>Bay</span>

        </div>


        <!-- HERO -->

        <h1>

            Borrow what you need.

            <br>

            <span>Share what you have.</span>

        </h1>


        <!-- DESCRIPTION -->

        <p class="description">

            BorrowBay makes renting simple. Discover useful products

            from people and businesses around you, or list your own

            items and start earning.

        </p>


        <!-- BUTTONS -->

        <div class="buttons">


            <button

                    class="primary"

                    onclick="window.location.href='/register.html'">

                Get Started

            </button>


            <button

                    class="secondary"

                    onclick="window.location.href='/login.html'">

                I Already Have an Account

            </button>


        </div>


    </div>


</div>


</body>

</html>
