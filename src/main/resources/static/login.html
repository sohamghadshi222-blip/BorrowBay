<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BorrowBay</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #18212f;
            color: #f8fafc;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .container {
            width: 100%;
            max-width: 440px;

            background: #222d3d;
            border: 1px solid #334155;

            padding: 40px;
            border-radius: 18px;

            box-shadow:
                    0 18px 45px rgba(0, 0, 0, 0.25);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;

            font-size: 30px;
            font-weight: bold;

            margin-bottom: 8px;

            color: #f8fafc;
        }

        .logo span {
            color: #14b8a6;
        }

        .tagline {
            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 30px;
        }

        /* =========================
           HEADING
        ========================= */

        h2 {
            margin-bottom: 22px;

            font-size: 23px;

            color: #f8fafc;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #cbd5e1;
        }

        input {
            width: 100%;

            height: 46px;

            padding: 0 13px;

            border: 1px solid #3a4a60;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 14px;

            background: #172235;

            color: #f8fafc;

            outline: none;

            transition: 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #14b8a6;

            box-shadow:
                    0 0 0 2px rgba(20, 184, 166, 0.12);
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        button {
            width: 100%;

            height: 46px;

            padding: 0 14px;

            border: none;

            border-radius: 9px;

            background: #14b8a6;

            color: #061a18;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        button:hover {
            background: #2dd4bf;

            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 16px;

            min-height: 21px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;
        }

        /* =========================
           REGISTER
        ========================= */

        .register {
            text-align: center;

            margin-top: 23px;

            color: #94a3b8;

            font-size: 14px;
        }

        .register a {
            color: #2dd4bf;

            font-weight: bold;

            text-decoration: none;

            transition: 0.2s ease;
        }

        .register a:hover {
            color: #5eead4;
        }

        /* =========================
           BACK
        ========================= */

        .back {
            display: block;

            text-align: center;

            margin-top: 21px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .back:hover {
            color: #2dd4bf;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 16px;
            }

            .container {
                padding: 30px 24px;

                border-radius: 16px;
            }

            .logo {
                font-size: 27px;
            }

            h2 {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        Borrow<span>Bay</span>
    </div>


    <div class="tagline">
        Rent what you need. Share what you own.
    </div>


    <h2>
        Welcome Back
    </h2>


    <form id="loginForm">


        <label>
            Email
        </label>

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >


        <label>
            Password
        </label>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <div
            class="message"
            id="message">
    </div>


    <div class="register">

        Don't have an account?

        <a href="/register.html">
            Create Account
        </a>

    </div>


    <a
            class="back"
            href="/start.html">

        ← Back

    </a>


</div>


<script>


    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const message =
                    document
                        .getElementById("message");


                message.textContent =
                    "Logging in...";

                message.style.color =
                    "#94a3b8";


                try {


                    const response =
                        await fetch(
                            "/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                            }
                        );


                    if (!response.ok) {


                        const errorText =
                            await response.text();


                        message.textContent =
                            errorText ||
                            "Invalid email or password";


                        message.style.color =
                            "#f87171";


                        return;

                    }


                    const loggedInUser =
                        await response.json();


                    /*
                     * Store only the information
                     * required by the frontend.
                     *
                     * Password is NOT stored.
                     */

                    localStorage.setItem(
                        "borrowBayUser",
                        JSON.stringify({

                            id:
                            loggedInUser.id,

                            name:
                            loggedInUser.name,

                            email:
                            loggedInUser.email

                        })
                    );


                    message.textContent =
                        "Login successful!";


                    message.style.color =
                        "#2dd4bf";


                    setTimeout(() => {

                        window.location.href =
                            "/index.html";

                    }, 500);


                } catch (error) {


                    console.error(error);


                    message.textContent =
                        "Unable to connect to server.";


                    message.style.color =
                        "#f87171";

                }

            }
        );

</script>


</body>

</html>
