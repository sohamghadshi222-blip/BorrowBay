<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | BorrowBay</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #18212f;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* =========================
           MAIN CARD
        ========================= */

        .container {
            width: 100%;
            max-width: 440px;
            background: #222d3d;
            border: 1px solid #334155;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        .logo span {
            color: #14b8a6;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* =========================
           HEADING
        ========================= */

        h2 {
            margin-bottom: 22px;
            font-size: 23px;
            color: #f8fafc;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #3a4a60;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
            background: #172235;
            color: #f8fafc;
            outline: none;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.12);
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: none;
            border-radius: 9px;
            background: #14b8a6;
            color: #061a18;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 3px;
        }

        button:hover {
            background: #2dd4bf;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            min-height: 21px;
        }

        /* =========================
           BACK LINK
        ========================= */

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .back:hover {
            color: #2dd4bf;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 16px;
            }

            .container {
                padding: 30px 24px;
                border-radius: 16px;
            }

            .logo {
                font-size: 27px;
            }

            h2 {
                font-size: 21px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        Borrow<span>Bay</span>
    </div>

    <div class="subtitle">
        Keep your account secure
    </div>

    <h2>
        Change Password
    </h2>

    <form id="passwordForm">

        <label>
            Current Password
        </label>

        <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password"
                required
        >


        <label>
            New Password
        </label>

        <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                required
        >


        <label>
            Confirm New Password
        </label>

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
        >


        <button type="submit">
            Change Password
        </button>

    </form>


    <div
            class="message"
            id="message">
    </div>


    <a
            class="back"
            href="/index.html">

        ← Back to BorrowBay

    </a>

</div>


<script>

    document
        .getElementById("passwordForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("message");


            const userData =
                localStorage.getItem("borrowBayUser");


            if (!userData) {

                message.textContent =
                    "Please login again.";

                message.style.color =
                    "#f87171";

                return;
            }


            const user =
                JSON.parse(userData);


            if (newPassword.length < 6) {

                message.textContent =
                    "New password must be at least 6 characters.";

                message.style.color =
                    "#f87171";

                return;
            }


            if (newPassword !== confirmPassword) {

                message.textContent =
                    "New passwords do not match.";

                message.style.color =
                    "#f87171";

                return;
            }


            if (currentPassword === newPassword) {

                message.textContent =
                    "New password must be different from current password.";

                message.style.color =
                    "#f87171";

                return;
            }


            message.textContent =
                "Changing password...";

            message.style.color =
                "#94a3b8";


            try {

                const response =
                    await fetch(
                        "/api/auth/change-password",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: user.email,

                                currentPassword:
                                currentPassword,

                                newPassword:
                                newPassword

                            })
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    message.textContent =
                        result ||
                        "Unable to change password.";

                    message.style.color =
                        "#f87171";

                    return;
                }


                message.textContent =
                    "Password changed successfully!";

                message.style.color =
                    "#2dd4bf";


                document
                    .getElementById("passwordForm")
                    .reset();


                setTimeout(() => {

                    window.location.href =
                        "/index.html";

                }, 1500);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server.";

                message.style.color =
                    "#f87171";

            }

        });

</script>

</body>

</html>
