<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>My Listings | BorrowBay</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #18212f;
            color: #f8fafc;
            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;

            background: #0b1220;

            border-bottom: 1px solid #263449;

            display: flex;
            align-items: center;

            padding: 0 30px;
            gap: 20px;
        }


        .back {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            text-decoration: none;

            color: #f8fafc;

            background: #172235;

            border: 1px solid #334155;

            border-radius: 10px;

            transition: 0.2s ease;
        }


        .back:hover {
            color: #2dd4bf;

            border-color: #14b8a6;

            background: #1d2a3e;
        }


        header h1 {
            font-size: 23px;

            color: #f8fafc;
        }


        header h1 span {
            color: #14b8a6;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1150px;

            margin: 40px auto;

            padding: 0 20px;
        }


        /* =========================
           TOP
        ========================= */

        .top-section {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

            gap: 20px;
        }


        .top-section h2 {
            font-size: 29px;

            color: #f8fafc;
        }


        .add-btn {
            background: #14b8a6;

            color: #061a18;

            border: none;

            padding: 12px 18px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 700;

            font-size: 14px;

            transition: 0.2s ease;
        }


        .add-btn:hover {
            background: #2dd4bf;

            transform: translateY(-1px);
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {
            margin-bottom: 20px;

            font-weight: 600;

            font-size: 14px;

            min-height: 20px;
        }


        /* =========================
           FORM
        ========================= */

        .form-container {
            background: #222d3d;

            border: 1px solid #334155;

            padding: 26px;

            border-radius: 16px;

            margin-bottom: 30px;

            box-shadow:
                    0 12px 30px rgba(0,0,0,0.18);

            display: none;
        }


        .form-container h3 {
            margin-bottom: 20px;

            font-size: 20px;

            color: #f8fafc;
        }


        .logged-user {
            background: #172235;

            border: 1px solid #334155;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;
        }


        .logged-user strong {
            display: block;

            margin-bottom: 5px;

            color: #f8fafc;
        }


        .logged-user span {
            color: #94a3b8;

            font-size: 13px;
        }


        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }


        .field {
            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        .field.full {
            grid-column: 1 / -1;
        }


        label {
            font-weight: 600;

            margin-bottom: 7px;

            font-size: 13px;

            color: #cbd5e1;
        }


        input,
        textarea,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #3a4a60;

            border-radius: 9px;

            font-size: 14px;

            background: #172235;

            color: #f8fafc;

            outline: none;

            transition: 0.2s ease;
        }


        input::placeholder,
        textarea::placeholder {
            color: #64748b;
        }


        input:focus,
        textarea:focus,
        select:focus {
            border-color: #14b8a6;

            box-shadow:
                    0 0 0 2px
                    rgba(20,184,166,0.12);
        }


        input[readonly] {
            background: #121c2c;

            color: #94a3b8;

            cursor: not-allowed;
        }


        textarea {
            min-height: 100px;

            resize: vertical;

            line-height: 1.5;
        }


        /* FILE INPUT */

        input[type="file"] {
            padding: 10px;

            cursor: pointer;
        }


        input[type="file"]::file-selector-button {
            background: #14b8a6;

            color: #061a18;

            border: none;

            padding: 8px 12px;

            border-radius: 7px;

            font-weight: 700;

            cursor: pointer;

            margin-right: 10px;
        }


        .image-help {
            margin-top: 7px;

            color: #64748b;

            font-size: 12px;
        }


        .image-preview {
            width: 180px;

            height: 120px;

            margin-top: 12px;

            border-radius: 10px;

            overflow: hidden;

            border: 1px solid #334155;

            background: #172235;

            display: none;

            align-items: center;

            justify-content: center;
        }


        .image-preview img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        /* =========================
           BUTTONS
        ========================= */

        .form-buttons {
            margin-top: 20px;

            display: flex;

            gap: 10px;
        }


        .save-btn,
        .cancel-btn {
            min-height: 42px;

            padding: 11px 22px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 700;

            font-size: 14px;

            transition: 0.2s ease;
        }


        .save-btn {
            background: #14b8a6;

            color: #061a18;

            border: none;
        }


        .save-btn:hover {
            background: #2dd4bf;

            transform: translateY(-1px);
        }


        .cancel-btn {
            background: transparent;

            color: #cbd5e1;

            border: 1px solid #475569;
        }


        .cancel-btn:hover {
            background: #172235;

            border-color: #64748b;
        }


        /* =========================
           LISTINGS
        ========================= */

        .listings {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            background: #222d3d;

            border: 1px solid #334155;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                    0 12px 30px
                    rgba(0,0,0,0.18);

            transition:
                    transform 0.2s ease,
                    border-color 0.2s ease;
        }


        .card:hover {
            transform: translateY(-2px);

            border-color: #3d526c;
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .image {
            width: 100%;

            height: 200px;

            background: #172235;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

            border-bottom: 1px solid #334155;
        }


        .image img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .image-placeholder {
            font-size: 65px;
        }


        /* =========================
           CARD CONTENT
        ========================= */

        .card-content {
            padding: 18px;
        }


        .card h3 {
            margin-bottom: 6px;

            font-size: 19px;

            color: #f8fafc;

            line-height: 1.35;
        }


        .category {
            color: #94a3b8;

            font-size: 13px;

            margin-bottom: 11px;
        }


        .owner {
            font-size: 13px;

            color: #cbd5e1;

            margin-bottom: 10px;
        }


        .owner strong {
            color: #f8fafc;
        }


        .owner-email {
            font-size: 12px;

            color: #64748b;

            margin-top: 3px;

            overflow-wrap: anywhere;
        }


        .description {
            font-size: 14px;

            color: #94a3b8;

            margin-bottom: 14px;

            line-height: 1.5;

            display: -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient: vertical;

            overflow: hidden;

            min-height: 63px;
        }


        .price {
            font-size: 19px;

            font-weight: bold;

            color: #2dd4bf;

            margin-bottom: 10px;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-flex;

            align-items: center;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;

            background:
                    rgba(20,184,166,0.12);

            border:
                    1px solid
                    rgba(20,184,166,0.28);

            color: #2dd4bf;

            margin-bottom: 15px;
        }


        .rented-status {
            background:
                    rgba(245,158,11,0.12);

            border-color:
                    rgba(245,158,11,0.30);

            color: #fbbf24;
        }


        /* =========================
           RENTAL BOX
        ========================= */

        .rental-box {
            background: #172235;

            border: 1px solid #334155;

            border-radius: 10px;

            padding: 14px;

            margin-bottom: 15px;

            font-size: 13px;

            line-height: 1.6;
        }


        .rental-box-title {
            color: #2dd4bf;

            font-weight: 700;

            margin-bottom: 8px;

            font-size: 14px;
        }


        .return-btn {
            width: 100%;

            border: none;

            background: #14b8a6;

            color: #061a18;

            padding: 10px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 700;

            margin-top: 10px;
        }


        .return-btn:hover {
            background: #2dd4bf;
        }


        /* =========================
           CARD BUTTONS
        ========================= */

        .card-buttons {
            display: flex;

            gap: 8px;
        }


        .edit-btn,
        .delete-btn {
            flex: 1;

            padding: 10px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 700;

            font-size: 13px;

            transition: 0.2s ease;
        }


        .edit-btn {
            background: #172235;

            color: #2dd4bf;

            border: 1px solid #14b8a6;
        }


        .edit-btn:hover {
            background:
                    rgba(20,184,166,0.10);
        }


        .delete-btn {
            background:
                    rgba(239,68,68,0.10);

            color: #f87171;

            border: 1px solid #ef4444;
        }


        .delete-btn:hover {
            background:
                    rgba(239,68,68,0.18);
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            background: #222d3d;

            border: 1px solid #334155;

            padding: 55px 25px;

            text-align: center;

            border-radius: 16px;

            color: #94a3b8;

            grid-column: 1 / -1;
        }


        .empty h3 {
            color: #f8fafc;

            margin-bottom: 8px;

            font-size: 19px;
        }


        .empty p {
            color: #94a3b8;

            line-height: 1.5;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .listings {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        @media (max-width: 650px) {

            header {
                height: 64px;

                padding: 0 18px;
            }


            header h1 {
                font-size: 21px;
            }


            .container {
                margin: 30px auto;

                padding: 0 16px;
            }


            .top-section {
                flex-direction: column;

                align-items: stretch;

                gap: 15px;
            }


            .top-section h2 {
                font-size: 26px;
            }


            .add-btn {
                width: 100%;
            }


            .listings {
                grid-template-columns: 1fr;
            }


            .form-grid {
                grid-template-columns: 1fr;
            }


            .field.full {
                grid-column: auto;
            }


            .form-container {
                padding: 20px;
            }

        }


    </style>

</head>


<body>


<header>

    <a
            href="/index.html"
            class="back"
    >

        ←

    </a>


    <h1>
        Borrow<span>Bay</span>
    </h1>

</header>


<div class="container">


    <!-- TOP -->

    <div class="top-section">

        <h2>
            Your Listings
        </h2>


        <button
                class="add-btn"
                onclick="openAddForm()"
        >

            + Add New Listing

        </button>

    </div>


    <div id="message"></div>


    <!-- =========================
         FORM
    ========================= -->

    <div
            class="form-container"
            id="listingForm"
    >

        <h3 id="formTitle">

            Add a Product for Rent

        </h3>


        <div class="logged-user">

            <strong id="loggedUserName">
                Owner Name
            </strong>

            <span id="loggedUserEmail">
                Email
            </span>

        </div>


        <form id="productForm">


            <div class="form-grid">


                <!-- OWNER -->

                <div class="field">

                    <label>
                        Owner Name
                    </label>

                    <input
                            type="text"
                            id="ownerName"
                            readonly
                            required
                    >

                </div>


                <div class="field">

                    <label>
                        Owner Email
                    </label>

                    <input
                            type="email"
                            id="ownerEmail"
                            readonly
                            required
                    >

                </div>


                <!-- PRODUCT -->

                <div class="field">

                    <label>
                        Product Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            placeholder="e.g. Sony Camera"
                            required
                    >

                </div>


                <div class="field">

                    <label>
                        Category
                    </label>

                    <select
                            id="category"
                            required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option>Camera</option>

                        <option>Electronics</option>

                        <option>Gaming</option>

                        <option>Vehicle</option>

                        <option>Sports</option>

                        <option>Camping</option>

                        <option>Furniture</option>

                        <option>Other</option>

                    </select>

                </div>


                <div class="field">

                    <label>
                        Price per Day (₹)
                    </label>

                    <input
                            type="number"
                            id="price"
                            min="1"
                            placeholder="500"
                            required
                    >

                </div>


                <div class="field">

                    <label>
                        Availability
                    </label>

                    <select
                            id="availability"
                            required
                    >

                        <option value="Available">
                            Available
                        </option>

                        <option value="Unavailable">
                            Unavailable
                        </option>

                        <option value="rented">
                            Rented
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->

                <div class="field full">

                    <label>
                        Description
                    </label>

                    <textarea
                            id="description"
                            placeholder="Describe your product..."
                            required
                    ></textarea>

                </div>


                <!-- IMAGE -->

                <div class="field full">

                    <label>
                        Product Image
                    </label>

                    <input
                            type="file"
                            id="imageFile"
                            accept="image/*"
                    >


                    <div class="image-help">

                        JPG, PNG or WEBP •
                        Maximum 5 MB

                    </div>


                    <div
                            class="image-preview"
                            id="imagePreview"
                    >

                        <img
                                id="previewImage"
                                alt="Preview"
                        >

                    </div>

                </div>


                <!-- UPI -->

                <div class="field">

                    <label>
                        UPI ID
                    </label>

                    <input
                            type="text"
                            id="upiId"
                            placeholder="yourname@upi"
                            required
                    >

                </div>


                <!-- PICKUP -->

                <div class="field">

                    <label>
                        Pickup Address
                    </label>

                    <input
                            type="text"
                            id="pickupAddress"
                            placeholder="Pickup location"
                            required
                    >

                </div>


                <!-- RETURN -->

                <div class="field">

                    <label>
                        Return / Drop-off Address
                    </label>

                    <input
                            type="text"
                            id="returnAddress"
                            placeholder="Return location"
                            required
                    >

                </div>


            </div>


            <div class="form-buttons">

                <button
                        type="submit"
                        class="save-btn"
                        id="saveButton"
                >

                    Add Listing

                </button>


                <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeForm()"
                >

                    Cancel

                </button>

            </div>


        </form>

    </div>


    <!-- LISTINGS -->

    <div
            class="listings"
            id="listings"
    >

        <div class="empty">

            Loading your listings...

        </div>

    </div>


</div>


<script>


    /* =========================
       USER
    ========================= */

    const user =
        JSON.parse(
            localStorage.getItem(
                "borrowBayUser"
            )
        );


    let editingId = null;

    let existingImage = "";


    if (!user) {

        alert("Please login first.");

        window.location.href =
            "/login.html";

    }


    /* =========================
       USER DETAILS
    ========================= */

    function setLoggedInUser() {

        if (!user) return;


        document.getElementById(
            "ownerName"
        ).value =
            user.name || "";


        document.getElementById(
            "ownerEmail"
        ).value =
            user.email || "";


        document.getElementById(
            "loggedUserName"
        ).textContent =
            user.name || "User";


        document.getElementById(
            "loggedUserEmail"
        ).textContent =
            user.email || "";

    }


    /* =========================
       ADD FORM
    ========================= */

    function openAddForm() {

        editingId = null;

        existingImage = "";


        document.getElementById(
            "formTitle"
        ).textContent =
            "Add a Product for Rent";


        document.getElementById(
            "saveButton"
        ).textContent =
            "Add Listing";


        document.getElementById(
            "productForm"
        ).reset();


        setLoggedInUser();


        document.getElementById(
            "availability"
        ).disabled = false;


        hideImagePreview();


        document.getElementById(
            "listingForm"
        ).style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =========================
       CLOSE FORM
    ========================= */

    function closeForm() {

        editingId = null;

        existingImage = "";


        document.getElementById(
            "listingForm"
        ).style.display =
            "none";


        document.getElementById(
            "productForm"
        ).reset();


        document.getElementById(
            "availability"
        ).disabled = false;


        hideImagePreview();


        setLoggedInUser();

    }


    /* =========================
       IMAGE PREVIEW
    ========================= */

    document.getElementById(
        "imageFile"
    ).addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (!file) {

                if (existingImage) {

                    showImagePreview(
                        existingImage
                    );

                } else {

                    hideImagePreview();

                }

                return;

            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Please select an image file."
                );

                this.value = "";

                return;

            }


            if (
                file.size >
                5 * 1024 * 1024
            ) {

                alert(
                    "Image must be smaller than 5 MB."
                );

                this.value = "";

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    showImagePreview(
                        event.target.result
                    );

                };


            reader.readAsDataURL(file);

        }
    );


    function showImagePreview(
        image
    ) {

        const preview =
            document.getElementById(
                "imagePreview"
            );


        const img =
            document.getElementById(
                "previewImage"
            );


        img.src = image;


        preview.style.display =
            "flex";

    }


    function hideImagePreview() {

        const preview =
            document.getElementById(
                "imagePreview"
            );


        const img =
            document.getElementById(
                "previewImage"
            );


        img.src = "";


        preview.style.display =
            "none";

    }


    /* =========================
       LOAD MY LISTINGS
    ========================= */

    async function loadListings() {

        const container =
            document.getElementById(
                "listings"
            );


        try {

            const [
                productResponse,
                bookings
            ] =
                await Promise.all([

                    fetch(
                        `/api/products/owner?email=${encodeURIComponent(user.email)}`
                    ),

                    getOwnerBookings()

                ]);


            if (
                !productResponse.ok
            ) {

                throw new Error(
                    "Unable to load listings"
                );

            }


            const products =
                await productResponse.json();


            if (
                !products ||
                products.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        <h3>
                            No listings yet
                        </h3>

                        <p>
                            Add your first product
                            and start earning from it.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            products.forEach(
                product => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "card";


                    const isRented =
                        String(
                            product.availability ||
                            ""
                        ).toLowerCase() ===
                        "rented";


                    const booking =
                        bookings

                            .filter(
                                b =>
                                    Number(
                                        b.productId
                                    ) ===
                                    Number(
                                        product.id
                                    )
                            )

                            .sort(
                                (a,b) =>
                                    Number(
                                        b.id || 0
                                    ) -
                                    Number(
                                        a.id || 0
                                    )
                            )[0];


                    /* IMAGE */

                    let imageHTML = `

                        <div class="image">

                            <div
                                class="image-placeholder"
                            >
                                📦
                            </div>

                        </div>

                    `;


                    if (
                        product.image &&
                        String(
                            product.image
                        ).trim() !== ""
                    ) {

                        imageHTML = `

                            <div class="image">

                                <img
                                    src="${product.image}"
                                    alt="${escapeHTML(
                            product.name ||
                            "Product"
                        )}"
                                    onerror="
                                        this.style.display='none';
                                        this.nextElementSibling.style.display='block';
                                    "
                                >

                                <div
                                    class="image-placeholder"
                                    style="display:none;"
                                >
                                    📦
                                </div>

                            </div>

                        `;

                    }


                    /* RENTAL */

                    let rentalHTML = "";


                    if (
                        isRented &&
                        booking
                    ) {

                        rentalHTML = `

                            <div class="rental-box">

                                <div
                                    class="rental-box-title"
                                >

                                    📦 Current Rental

                                </div>


                                <div>

                                    <strong>
                                        Renter:
                                    </strong>

                                    ${escapeHTML(
                            booking.renterName ||
                            "Unknown"
                        )}

                                </div>


                                <div>

                                    <strong>
                                        Email:
                                    </strong>

                                    ${escapeHTML(
                            booking.renterEmail ||
                            "Not provided"
                        )}

                                </div>


                                <div>

                                    <strong>
                                        Phone:
                                    </strong>

                                    ${escapeHTML(
                            booking.renterPhone ||
                            "Not provided"
                        )}

                                </div>


                                <div>

                                    <strong>
                                        Pickup:
                                    </strong>

                                    ${escapeHTML(
                            booking.startDate ||
                            "Not provided"
                        )}

                                </div>


                                <div>

                                    <strong>
                                        Return:
                                    </strong>

                                    ${escapeHTML(
                            booking.endDate ||
                            "Not provided"
                        )}

                                </div>


                                <div>

                                    <strong>
                                        Status:
                                    </strong>

                                    ${escapeHTML(
                            booking.status ||
                            "CONFIRMED"
                        )}

                                </div>


                                <button
                                    class="return-btn"
                                    onclick="returnProduct(${product.id})"
                                >

                                    Mark as Returned

                                </button>

                            </div>

                        `;

                    }


                    const statusClass =
                        isRented
                            ? "status rented-status"
                            : "status";


                    card.innerHTML = `

                        ${imageHTML}


                        <div class="card-content">


                            <h3>

                                ${escapeHTML(
                        product.name ||
                        "Unnamed Product"
                    )}

                            </h3>


                            <div class="category">

                                ${escapeHTML(
                        product.category ||
                        "Other"
                    )}

                            </div>


                            <div class="owner">

                                Owner:

                                <strong>

                                    ${escapeHTML(
                        product.ownerName ||
                        user.name ||
                        "Unknown"
                    )}

                                </strong>


                                <div
                                    class="owner-email"
                                >

                                    ${escapeHTML(
                        product.ownerEmail ||
                        user.email ||
                        ""
                    )}

                                </div>

                            </div>


                            <div class="description">

                                ${escapeHTML(
                        product.description ||
                        "No description"
                    )}

                            </div>


                            <div class="price">

                                ₹${Number(
                        product.price ||
                        0
                    )}/day

                            </div>


                            <span
                                class="${statusClass}"
                            >

                                ${escapeHTML(
                        product.availability ||
                        "Available"
                    )}

                            </span>


                            ${rentalHTML}


                            <div
                                class="card-buttons"
                            >

                                <button
                                    class="edit-btn"
                                    onclick="editListing(
                                        ${product.id}
                                    )"
                                >

                                    Edit

                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteListing(
                                        ${product.id}
                                    )"
                                >

                                    Remove

                                </button>

                            </div>


                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(error);


            container.innerHTML = `

                <div class="empty">

                    <h3>
                        Unable to load listings
                    </h3>

                    <p>
                        Please make sure the
                        server is running.
                    </p>

                </div>

            `;

        }

    }


    /* =========================
       GET OWNER BOOKINGS
    ========================= */

    async function getOwnerBookings() {

        try {

            const response =
                await fetch(
                    `/api/bookings/owner?email=${encodeURIComponent(
                        user.email
                    )}`
                );


            if (!response.ok) {

                return [];

            }


            return await response.json();


        } catch (error) {

            console.error(
                "Booking loading error:",
                error
            );

            return [];

        }

    }


    /* =========================
       EDIT
    ========================= */

    async function editListing(
        id
    ) {

        try {

            const response =
                await fetch(
                    `/api/products/${id}`
                );


            if (!response.ok) {

                throw new Error(
                    "Product not found"
                );

            }


            const product =
                await response.json();


            editingId =
                product.id;


            existingImage =
                product.image || "";


            document.getElementById(
                "formTitle"
            ).textContent =
                "Edit Product";


            document.getElementById(
                "saveButton"
            ).textContent =
                "Save Changes";


            document.getElementById(
                "ownerName"
            ).value =
                user.name || "";


            document.getElementById(
                "ownerEmail"
            ).value =
                user.email || "";


            document.getElementById(
                "name"
            ).value =
                product.name || "";


            document.getElementById(
                "category"
            ).value =
                product.category || "";


            document.getElementById(
                "price"
            ).value =
                product.price || "";


            document.getElementById(
                "description"
            ).value =
                product.description || "";


            document.getElementById(
                "availability"
            ).value =
                product.availability ||
                "Available";


            document.getElementById(
                "upiId"
            ).value =
                product.upiId || "";


            document.getElementById(
                "pickupAddress"
            ).value =
                product.pickupAddress ||
                "";


            document.getElementById(
                "returnAddress"
            ).value =
                product.returnAddress ||
                "";


            document.getElementById(
                "imageFile"
            ).value = "";


            const isRented =
                String(
                    product.availability ||
                    ""
                ).toLowerCase() ===
                "rented";


            document.getElementById(
                "availability"
            ).disabled =
                isRented;


            if (existingImage) {

                showImagePreview(
                    existingImage
                );

            } else {

                hideImagePreview();

            }


            document.getElementById(
                "listingForm"
            ).style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            console.error(error);


            alert(
                "Unable to load product details."
            );

        }

    }


    /* =========================
       SAVE PRODUCT
    ========================= */

    document
        .getElementById(
            "productForm"
        )
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    document.getElementById(
                        "message"
                    );


                const imageFile =
                    document.getElementById(
                        "imageFile"
                    ).files[0];


                const availabilityElement =
                    document.getElementById(
                        "availability"
                    );


                let image =
                    existingImage;


                /* NEW IMAGE */

                if (imageFile) {

                    try {

                        image =
                            await compressImage(
                                imageFile
                            );

                    } catch (error) {

                        alert(
                            "Unable to process image."
                        );

                        return;

                    }

                }


                const product = {

                    ownerName:
                    user.name,

                    ownerEmail:
                    user.email,

                    name:
                        document
                            .getElementById(
                                "name"
                            )
                            .value
                            .trim(),

                    category:
                    document
                        .getElementById(
                            "category"
                        )
                        .value,

                    description:
                        document
                            .getElementById(
                                "description"
                            )
                            .value
                            .trim(),

                    price:
                        Number(
                            document
                                .getElementById(
                                    "price"
                                )
                                .value
                        ),

                    image:
                        image || "",

                    availability:
                        availabilityElement.disabled
                            ? "rented"
                            : availabilityElement.value,

                    pickupAddress:
                        document
                            .getElementById(
                                "pickupAddress"
                            )
                            .value
                            .trim(),

                    returnAddress:
                        document
                            .getElementById(
                                "returnAddress"
                            )
                            .value
                            .trim(),

                    upiId:
                        document
                            .getElementById(
                                "upiId"
                            )
                            .value
                            .trim()

                };


                try {

                    message.textContent =
                        editingId
                            ? "Saving changes..."
                            : "Adding listing...";


                    message.style.color =
                        "#94a3b8";


                    const url =
                        editingId
                            ? `/api/products/${editingId}`
                            : "/api/products";


                    const method =
                        editingId
                            ? "PUT"
                            : "POST";


                    const response =
                        await fetch(
                            url,
                            {

                                method:
                                method,

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        product
                                    )

                            }
                        );


                    if (!response.ok) {

                        const error =
                            await response.text();


                        throw new Error(
                            error ||
                            "Request failed"
                        );

                    }


                    message.textContent =
                        editingId
                            ? "Product updated successfully!"
                            : "Listing added successfully!";


                    message.style.color =
                        "#2dd4bf";


                    closeForm();


                    await loadListings();


                } catch (error) {

                    console.error(
                        error
                    );


                    message.textContent =
                        "Unable to save product.";


                    message.style.color =
                        "#f87171";

                }

            }
        );


    /* =========================
       IMAGE COMPRESSION
    ========================= */

    function compressImage(
        file
    ) {

        return new Promise(
            (resolve, reject) => {

                const reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        const img =
                            new Image();


                        img.onload =
                            function() {

                                const maxWidth =
                                    1000;


                                const maxHeight =
                                    1000;


                                let width =
                                    img.width;


                                let height =
                                    img.height;


                                if (
                                    width >
                                    maxWidth
                                ) {

                                    height =
                                        height *
                                        maxWidth /
                                        width;

                                    width =
                                        maxWidth;

                                }


                                if (
                                    height >
                                    maxHeight
                                ) {

                                    width =
                                        width *
                                        maxHeight /
                                        height;

                                    height =
                                        maxHeight;

                                }


                                const canvas =
                                    document
                                        .createElement(
                                            "canvas"
                                        );


                                canvas.width =
                                    width;


                                canvas.height =
                                    height;


                                const ctx =
                                    canvas
                                        .getContext(
                                            "2d"
                                        );


                                ctx.drawImage(
                                    img,
                                    0,
                                    0,
                                    width,
                                    height
                                );


                                const result =
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        0.80
                                    );


                                resolve(
                                    result
                                );

                            };


                        img.onerror =
                            reject;


                        img.src =
                            event.target.result;

                    };


                reader.onerror =
                    reject;


                reader.readAsDataURL(
                    file
                );

            }
        );

    }


    /* =========================
       DELETE
    ========================= */

    async function deleteListing(
        id
    ) {

        if (
            !confirm(
                "Are you sure you want to remove this listing?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/products/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Delete failed"
                );

            }


            await loadListings();


        } catch (error) {

            console.error(
                error
            );


            alert(
                "Unable to remove listing."
            );

        }

    }


    /* =========================
       RETURN PRODUCT
    ========================= */

    async function returnProduct(
        productId
    ) {

        if (
            !confirm(
                "Has the product been returned?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/bookings/return/${productId}`,
                    {
                        method: "PUT"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Return failed"
                );

            }


            alert(
                "Product marked as returned. It is available again."
            );


            await loadListings();


        } catch (error) {

            console.error(
                error
            );


            alert(
                "Unable to mark product as returned."
            );

        }

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================
       START
    ========================= */

    if (user) {

        setLoggedInUser();

        loadListings();

    }


</script>
